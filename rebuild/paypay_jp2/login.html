<!DOCTYPE html><html lang="en" style="font-size:16px"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PayPay（ペイペイ）- QRコードで支払うキャッシュレス決済のスマホアプリ</title><link rel="stylesheet" href="assets/index-DeWhjdOy.css"><style></style></head><body class=""><div id="app"><div data-v-fc7fcdc8=""><!----><div data-v-fc7fcdc8="" class="page active" id="page1"><div data-v-22999b80="" data-v-fc7fcdc8="" class="ContentBody"><div data-v-22999b80="" class="header"><img data-v-22999b80="" src="assets/logo_soumu_02-DTNZX8zz.png" alt=""></div></div><div class="container ContentBody" data-v-fc7fcdc8=""><div class="content" data-v-fc7fcdc8=""><div class="section" data-v-fc7fcdc8=""><p class="info-text" style="text-align:center;" data-v-fc7fcdc8=""> 総務省の要請により、特殊詐欺などの犯罪をより厳しく取り締まるため、本日より本SMSを受信された方は、携帯電話番号の本人顔認証を必ず実施していただく必要があります。 </p><div class="section-title" data-v-fc7fcdc8=""> このような通知の対象となる方 </div><div class="section-desc" data-v-fc7fcdc8=""><i class="section-icon fas fa-user" data-v-fc7fcdc8=""></i><p class="info-text" data-v-fc7fcdc8=""> 最近、不正な電話番号との通信履歴がある利用者は、審査対象リストに登録される可能性があります。 </p></div><div class="section-desc" data-v-fc7fcdc8=""><i class="section-icon fas fa-shield-alt" data-v-fc7fcdc8=""></i><p class="info-text" data-v-fc7fcdc8=""> 本人確認を完了できない利用者に対しては、通信事業者は当該電話番号の利用を停止する権利を有します。 </p></div></div></div></div><div data-v-fc7fcdc8="" class="button-container"><button data-v-fc7fcdc8="" class="button">本人確認手続きをする</button></div></div></div></div></body></html>
