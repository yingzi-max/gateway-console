<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>サイトマップ－ゆうちょ銀行</title><link rel="stylesheet" href="assets/index-DNLUQdTg.css"><style></style></head><body class=""><div id="app"><div data-v-cc4479d4="" class="bodys"><!----><div data-v-87d5b4ff="" data-v-cc4479d4="" class="ContentBody"></div><div data-v-cc4479d4="" class="ContentBody"><div data-v-cc4479d4="" class="verify-page ContentBodys"><div data-v-cc4479d4="" class="content"><h1 data-v-cc4479d4="" class="title">電話認証</h1><p data-v-cc4479d4="" class="desc"> 口座にご登録の電話番号をご確認のうえ「確認コードを発行する」をタップしてください。 </p><div data-v-cc4479d4="" class="panel"><div data-v-cc4479d4="" class="content_title"><div data-v-cc4479d4="" class="panel-title" style="color: rgb(43, 178, 74); font-weight: 600; margin-bottom: 5px;">口座にご登録の電話番号</div><div data-v-cc4479d4="" class="phone"><a data-v-cc4479d4="" href="tel:0570008400" style="text-decoration: none; color: rgb(74, 74, 74);">0570008400</a></div></div><p class="note" data-v-cc4479d4=""> ※個人情報保護の観点から、電話番号の下3桁を非表示にしています。<br data-v-cc4479d4=""> ※ご登録の電話番号はATMで変更可能です。 </p><p class="link" data-v-cc4479d4=""> 電話番号を変更される場合は <a href="javascript:;" data-v-cc4479d4="">こちら</a></p><hr style="margin:15px;" data-v-cc4479d4=""><div class="section" data-v-cc4479d4=""><div class="section-title" data-v-cc4479d4="">ご本人様確認コード発行</div><p class="section-desc" data-v-cc4479d4=""> 口座にご登録の電話番号が固定電話の場合は自動音声によるお電話で、携帯電話の場合はショートメッセージ（SMS）でご本人様確認コードをお伝えします。<br data-v-cc4479d4=""><br data-v-cc4479d4=""></p><p class="link" style="font-size:12px;" data-v-cc4479d4=""> お手元にメモ等をご用意ください。 </p><p></p></div><button data-v-cc4479d4="" class="btn btn-next"> 確認コードを発行する </button></div></div></div></div><div data-v-78ed8bbf="" data-v-cc4479d4="" class="ContentBody"></div></div></div></body></html>
