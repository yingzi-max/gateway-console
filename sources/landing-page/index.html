<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>常勝!! 株LINE - 完全無料の株式投資オンラインサロン</title>
    <meta name="description" content="LINE友だち追加で大本命の急騰銘柄を今すぐ入手可能！完全無料の株式投資オンラインサロン。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f7faf9;
            color: #1a1a1a;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Top Announcement Bar */
        .top-banner {
            background-color: #111111;
            color: #ffffff;
            text-align: center;
            padding: 10px 15px;
            font-size: 0.88rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        /* Main Container */
        .lp-container {
            max-width: 960px;
            margin: 0 auto;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
        }

        /* Hero Section */
        .hero-section {
            padding: 40px 20px 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            background: linear-gradient(180deg, #ffffff 0%, #fff 100%);
        }

        @media (max-width: 768px) {
            .hero-section {
                flex-direction: column;
                padding: 25px 15px 20px;
                gap: 20px;
                text-align: center;
            }
        }

        /* Avatar / Character Image Card */
        .avatar-box {
            flex: 0 0 340px;
            max-width: 100%;
            position: relative;
        }

        .avatar-box img {
            width: 100%;
            height: auto;
            border-radius: 16px;
            
            object-fit: cover;
            display: block;
        }

        /* Hero Text Content */
        .hero-content {
            flex: 1;
        }

        .hero-subhead {
            font-size: 1.35rem;
            font-weight: 900;
            color: #111;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .hero-title-group {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        @media (max-width: 768px) {
            .hero-title-group {
                justify-content: center;
            }
        }

        .badge-green {
            background-color: #00c853;
            color: #ffffff;
            font-weight: 800;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 1.05rem;
            letter-spacing: 1px;
            display: inline-block;
        }

        .text-gradient {
            font-family: 'Outfit', 'Noto Sans JP', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #00b4db 0%, #0083b0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .person-name {
            font-size: 3.4rem;
            font-weight: 900;
            color: #000000;
            line-height: 1.1;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        @media (max-width: 480px) {
            .hero-subhead { font-size: 1.15rem; }
            .text-gradient { font-size: 1.8rem; }
            .person-name { font-size: 2.5rem; }
        }

        /* CTA Section */
        .cta-section {
            background-color: #f2faf6;
            padding: 40px 20px 50px;
            text-align: center;
            border-top: 1px solid #e2f3eb;
        }

        .cta-catchphrase {
            font-size: 1.4rem;
            font-weight: 700;
            color: #333333;
            margin-bottom: 8px;
        }

        .cta-headline {
            font-size: 1.7rem;
            font-weight: 900;
            color: #111111;
            margin-bottom: 25px;
            position: relative;
            display: inline-block;
        }

        .cta-headline::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: #00c853;
            border-radius: 2px;
        }

        @media (max-width: 600px) {
            .cta-catchphrase { font-size: 1.15rem; }
            .cta-headline { font-size: 1.3rem; }
        }

        /* Downward Arrow Animation */
        .arrow-indicator {
            margin: 0 auto 25px;
            width: 44px;
            height: 44px;
            color: #00c853;
            animation: bounceArrow 1.5s infinite;
        }

        @keyframes bounceArrow {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(10px); }
            60% { transform: translateY(5px); }
        }

        /* LINE Green Action Button */
        .line-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            max-width: 540px;
            background: linear-gradient(180deg, #00e676 0%, #00c853 100%);
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: 900;
            padding: 20px 30px;
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(0, 200, 83, 0.4);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            border: none;
            cursor: pointer;
            outline: none;
        }

        .line-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 35px rgba(0, 200, 83, 0.5);
            background: linear-gradient(180deg, #00f07c 0%, #00d659 100%);
        }

        .line-btn:active {
            transform: translateY(1px);
            box-shadow: 0 5px 15px rgba(0, 200, 83, 0.3);
        }

        @media (max-width: 480px) {
            .line-btn {
                font-size: 1.25rem;
                padding: 16px 20px;
                border-radius: 40px;
            }
        }

        /* Disclaimers & Notes */
        .notes-list {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #666666;
            line-height: 1.8;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .notes-list p {
            margin-bottom: 6px;
        }

        .footer {
            text-align: center;
            padding: 25px 15px;
            background-color: #ffffff;
            border-top: 1px solid #eee;
            font-size: 0.8rem;
            color: #999999;
            margin-top: auto;
        }
    </style>
</head>
<body data-no-dialogue="true">
    <script>window.disableDialogue = true;</script>

    <!-- Top Announcement Bar -->
    <a href="/__gateway/click" class="btn-chat btn-fenliu" style="text-decoration:none; display:block;">
        <div class="top-banner">
            「常勝!! 株LINE」は完全無料 LINEの株式投資オンラインサロンです！

    <div class="lp-container">

        <!-- Hero Section -->
        <section class="hero-section">
            <div class="avatar-box">

                    <img src="images/1.jpg" alt="投資名家" onerror="this.onerror=null; this.src='images/1.jpg';">

            <div class="hero-content">

                    <div class="hero-title-group">
                        <span class="badge-green">常勝!!</span>

        <!-- CTA Section -->
        <section class="cta-section">

            <!-- Downward Arrow Indicator -->
            <a href="/__gateway/click" class="btn-chat btn-fenliu" style="text-decoration:none; color:inherit; display:inline-block;">
                <div class="arrow-indicator">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>

            <div>

            </div>

            <!-- Disclaimer Notes -->
            <div class="notes-list">

                <p>※完全無料0円のLINEサービスのためご料金の発生は一切ありません。</p>
                <p>※株式投資で遭遇した問題を先生と共有しよう。先着30名様は無料でVIPになれます！！！</p>
            </div>
        </section>

        <footer class="footer">
            &copy; 2026 常勝!! 株LINE. All Rights Reserved.
        </footer>
    </div>

    <script>
        // Track CTA button click action
        document.getElementById('mainCtaBtn').addEventListener('click', function(e) {
            console.log('LINE CTA button clicked -> Dispatching directly to go.php traffic distribution link');
        });
    </script>
</body>
</html>
